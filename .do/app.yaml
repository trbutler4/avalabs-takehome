name: avalabs-takehome

region: nyc

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        rewrite: /
    - match:
        path:
          prefix: /health
      component:
        name: api
    - match:
        path:
          prefix: /
      component:
        name: web

services:
  - name: api
    dockerfile_path: apps/api/Dockerfile
    source_dir: /
    github:
      repo: trbutler4/avalabs-takehome
      branch: main
      deploy_on_push: false
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: "production"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DB_SSL
        scope: RUN_TIME
        value: "true"
      - key: ALCHEMY_API_KEY
        scope: RUN_TIME
        type: SECRET
    health_check:
      http_path: /health

static_sites:
  - name: web
    github:
      repo: trbutler4/avalabs-takehome
      branch: main
      deploy_on_push: false
    build_command: npm ci && npm run build -w @repo/shared && npm run build -w @repo/web
    output_dir: apps/web/dist
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${APP_URL}/api

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: trbutler4/avalabs-takehome
      branch: main
      deploy_on_push: false
    build_command: npm ci && npm run build -w @repo/shared
    run_command: npm run migrate:up -w @repo/api
    instance_size_slug: apps-s-1vcpu-0.5gb
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DB_SSL
        scope: RUN_TIME
        value: "true"

databases:
  - name: db
    engine: PG
    production: false
    version: "16"
